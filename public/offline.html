<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#744722" />
    <title>KimLan - Ngoại tuyến</title>
    <style>
      * { box-sizing: border-box }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4eadc; color: #432918; font-family: system-ui, sans-serif }
      main { width: min(100%, 420px); padding: 32px 24px; text-align: center; border: 1px solid rgba(116,71,34,.22); border-radius: 24px; background: #fff9ef; box-shadow: 0 18px 45px rgba(74,45,23,.12) }
      img { width: 88px; height: 88px; object-fit: contain }
      h1 { margin: 18px 0 8px; font-size: 24px }
      p { margin: 0; line-height: 1.6; color: #76573e }
      button { margin-top: 24px; min-height: 44px; border: 0; border-radius: 12px; padding: 0 20px; background: #744722; color: #fff9ef; font-weight: 700 }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="KimLan" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Vui lòng kiểm tra kết nối mạng để tiếp tục sử dụng dữ liệu quản lý mới nhất.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
