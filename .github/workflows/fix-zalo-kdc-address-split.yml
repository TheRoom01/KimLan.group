name: Fix Zalo KDC address split

on:
  push:
    branches:
      - agent/fix-zalo-kdc-address-split

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-zalo-kdc-address-split
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Patch address parser and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          parser_path = Path("lib/zalo-import/parser.ts")
          source = parser_path.read_text(encoding="utf-8")

          old = r'''          .replace(
            new RegExp(
              `^(${houseNumberSource})\\s*[,;]\\s*(?=[A-Za-zÀ-ỹ])`,
              "i"
            ),
            "$1 "
          )
          .replace(
            /[\s,:;|\-–—]+$/g,
            ""
          )'''

          new = r'''          .replace(
            new RegExp(
              `^(${houseNumberSource})\\s*[,;]\\s*(?=[A-Za-zÀ-ỹ])`,
              "i"
            ),
            "$1 "
          )
          /*
           * ADDRESS_PARSER_V8_LOCALITY_SUFFIX
           *
           * Sau khi đã tách quận/phường, phần còn lại có thể là:
           * 16 Đường Số 3, KDC Intresco 13E
           *
           * KDC/KĐT không phải phường, nhưng vẫn là một phần hữu ích
           * để nhận diện đúng tòa nhà. Chuyển dấu phân cách trước
           * phần khu vực thành khoảng trắng để regex số nhà + đường
           * vẫn phân tích được mà không làm mất thông tin.
           */
          .replace(
            /\s*[,;|]\s*(?=(?:kdc|kđt|kdt|khu\s+dân\s+cư|khu\s+dan\s+cu|khu\s+đô\s+thị|khu\s+do\s+thi|cư\s+xá|cu\s+xa|chung\s+cư|chung\s+cu)\b)/gi,
            " "
          )
          .replace(
            /[\s,:;|\-–—]+$/g,
            ""
          )'''

          if old not in source:
              raise SystemExit("Address parser insertion point was not found")

          parser_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tools/zalo-reader/address-parser-smoke-test.ts")
          test_source = test_path.read_text(encoding="utf-8")

          marker = '''console.log(
  "Address Parser V5 regression: PASS"
);'''

          regression = '''const kdcIntrescoText = `
HIFRIENDZ - THÔNG BÁO DỰ ÁN MỚI

- Địa chỉ dự án: 16 Đường Số 3 , KDC Intresco 13E , Bình Chánh

Mã 101,201,301 giá 5tr5
`.trim();

const parsedKdcIntresco =
  parseZaloRoomText(
    kdcIntrescoText
  );

assert.equal(
  parsedKdcIntresco.roomPayload.house_number,
  "16",
  JSON.stringify(
    parsedKdcIntresco.roomPayload,
    null,
    2
  )
);

assert.equal(
  parsedKdcIntresco.roomPayload.address,
  "Đường Số 3 KDC Intresco 13E"
);

assert.equal(
  parsedKdcIntresco.roomPayload.ward,
  undefined
);

assert.equal(
  parsedKdcIntresco.roomPayload.district,
  "Bình Chánh"
);

'''

          if regression not in test_source:
              if marker not in test_source:
                  raise SystemExit("Address smoke-test insertion point was not found")
              test_source = test_source.replace(marker, regression + marker, 1)
              test_path.write_text(test_source, encoding="utf-8")
          PY

      - name: Run address regression test
        run: npx tsx tools/zalo-reader/address-parser-smoke-test.ts

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Commit tested fix
        shell: bash
        run: |
          git rm .github/workflows/fix-zalo-kdc-address-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/zalo-import/parser.ts tools/zalo-reader/address-parser-smoke-test.ts
          git commit -m "Fix Zalo KDC address splitting"
          git push
