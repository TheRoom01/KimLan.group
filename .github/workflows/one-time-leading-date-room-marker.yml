name: One-time leading date room marker patch

on:
  push:
    paths:
      - ".github/workflows/one-time-leading-date-room-marker.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-leading-date-room-marker.cjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/zalo-reader/parsers/utils.ts
          git commit -m "fix: support date-prefixed room markers"
          git push origin HEAD:main
