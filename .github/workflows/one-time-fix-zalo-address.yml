name: One-time fix Zalo address parser

on:
  push:
    paths:
      - ".github/workflows/one-time-fix-zalo-address.yml"

permissions:
  contents: write

jobs:
  patch-parser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch address parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/zalo-import/parser.ts")
          text = path.read_text(encoding="utf-8")
          original = text

          # Support F12 / F.12 as aliases of Phường 12 everywhere ward labels are parsed.
          ward_anchor = '    "p(?:\\\\.|(?=\\\\s|\\\\d))|" +\n'
          ward_replacement = (
              ward_anchor
              + '    "f(?:\\\\.|(?=\\\\s|\\\\d))|" +\n'
          )
          if ward_anchor not in text:
              raise SystemExit("ward label anchor not found")
          text = text.replace(ward_anchor, ward_replacement)

          # In compact project headers, underscores are separators rather than part of a street name.
          function_anchor = "  function analyzeLocationTail("
          function_pos = text.find(function_anchor)
          if function_pos < 0:
              raise SystemExit("analyzeLocationTail not found")

          newline_anchor = '        .replace(/\\r\\n?/g, "\\n")\n'
          newline_pos = text.find(newline_anchor, function_pos)
          if newline_pos < 0:
              raise SystemExit("newline normalization anchor not found")

          insert_pos = newline_pos + len(newline_anchor)
          underscore_line = '        .replace(/_+/g, ", ")\n'
          if underscore_line not in text[function_pos:insert_pos + 200]:
              text = text[:insert_pos] + underscore_line + text[insert_pos:]

          if text == original:
              raise SystemExit("No parser changes applied")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-fix-zalo-address.yml

      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/zalo-import/parser.ts .github/workflows/one-time-fix-zalo-address.yml
          git commit -m "fix: parse underscored Zalo addresses and F ward aliases"
          git push origin HEAD:main
