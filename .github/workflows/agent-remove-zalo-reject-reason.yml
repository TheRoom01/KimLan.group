name: Remove Zalo reject reason prompt

on:
  push:
    branches:
      - agent/remove-zalo-reject-reason-prompt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-zalo-reject-reason-prompt
          fetch-depth: 0

      - name: Remove reject reason prompt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/admin/zalo-imports/ZaloImportsClient.tsx")
          source = path.read_text(encoding="utf-8")
          old = '''    const reason =
                window.prompt(
                  "Lý do từ chối (có thể bỏ trống):"
                ) || "";'''
          new = '''    const reason = "";'''

          if old in source:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          elif new not in source:
              raise SystemExit("Expected reject reason prompt block was not found")
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/zalo-imports/ZaloImportsClient.tsx
          git commit -m "Remove Zalo reject reason prompt"
          git push
